sampling_hz: 60
raw_min_default: 500.0
raw_max_default: 3500.0
calibration_epsilon: 1.0
moving_average_window: 5
real:
  captured_samples: "数据手套数据/captured_samples.xlsx"
  base_mapping: "数据手套数据/base_mapping.json"
  manifest: "数据手套数据/manifest.json"
  output_bindings:
    th_cmc_joint: thumb_rotation
    th_mcp_joint: thumb_bend
    th_ip_joint: thumb_bend
    ff_mcp_joint: index_base_bend
    ff_dip_joint: index_base_bend
    mf_mcp_joint: middle_base_bend
    mf_dip_joint: middle_base_bend
    rf_mcp_joint: ring_base_bend
    rf_dip_joint: ring_base_bend
    lf_mcp_joint: pinky_base_bend
    lf_dip_joint: pinky_base_bend
channels:
  - thumb_mcp
  - thumb_pip
  - thumb_dip
  - index_mcp
  - index_pip
  - index_dip
  - middle_mcp
  - middle_pip
  - middle_dip
  - ring_mcp
  - ring_pip
  - ring_dip
  - little_mcp
  - little_pip
  - little_dip
