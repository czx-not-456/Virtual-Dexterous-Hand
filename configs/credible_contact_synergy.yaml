# Scheme D research prototype. Risk bound conditional on zero-mean errors,
# calibrated true covariance, and a locally linear hand model. Supplied
# covariance is only a descriptive proxy from repeated preset poses.
k_min: 2
k_max: 5
projection_abs_m: 0.0015
projection_relative: 0.10
jacobian_step: 0.0001
command_scale_m: {NEUTRAL: 0.010, PINCH: 0.003, WRAP: 0.006}
residual_caps: {NEUTRAL: 0.15, PINCH: 0.22, WRAP: 0.16}
task_prior_weight_m: 0.012
task_direction_weight_m: 0.012
task_command_weight_m: 0.004
rescue_threshold_m: 0.0015
rescue_min_improvement_m: 0.00002
max_residual_axes: 2
lambda_reference: 0.15
lambda_residual: 0.025
lambda_sparse: 0.004
delta_smoothing: 0.0001
maxiter: 50
fallback_full_reference: false
uncertainty_file: configs/chm6_uncertainty_proxy.json
control_sigma_deg: 2.0
uncertainty_enabled: true
contact_feedback_enabled: true
nonlinear_guard_enabled: true
# Diagnostic-only because the bundled repeated-pose proxy is not validated.
# Set enforce only after independent device-noise calibration + task trials.
risk_policy: diagnostic
risk_alpha: 0.10
risk_budget_m: 0.025
risk_contact_budget_m: 0.020
risk_basis_weight: 3.0
guard_regret_m: 0.001
# Disabled by default: if enabled, a dubious covariance proxy can cause many
# holds. Only use with independently calibrated uncertainty.
hard_hold_risk_m: 0.0
contact_dwell_frames: 2
contact_loss_frames: 2
contact_rescue_frames: 4
residual_in_secure_contact: false
