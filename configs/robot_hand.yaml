# CH-M6 左手的软件适配配置。第三方原始资源位于 CH-M6/，运行时只读。
version: ch-m6-adapter-v1
source_model_path: CH-M6/CH-M6_L.xml
joint_order: [th_cmc_joint, th_mcp_joint, th_ip_joint, ff_mcp_joint, ff_dip_joint, mf_mcp_joint, mf_dip_joint, rf_mcp_joint, rf_dip_joint, lf_mcp_joint, lf_dip_joint]
joint_ranges_deg:
  th_cmc_joint: [0.0, 99.981]
  th_mcp_joint: [0.0, 35.523]
  th_ip_joint: [0.0, 55.004]
  ff_mcp_joint: [0.0, 89.954]
  ff_dip_joint: [0.0, 86.517]
  mf_mcp_joint: [0.0, 89.954]
  mf_dip_joint: [0.0, 88.236]
  rf_mcp_joint: [0.0, 89.954]
  rf_dip_joint: [0.0, 86.517]
  lf_mcp_joint: [0.0, 89.954]
  lf_dip_joint: [0.0, 88.236]
# TODO(指导老师): 确认实物控制接口是否与 XML 一致为 11 个独立位置执行器。
architecture:
  nominal_dof: 11
  effective_actuators: 11
  actuator_order: [th_cmc_joint, th_mcp_joint, th_ip_joint, ff_mcp_joint, ff_dip_joint, mf_mcp_joint, mf_dip_joint, rf_mcp_joint, rf_dip_joint, lf_mcp_joint, lf_dip_joint]
finger_joints:
  thumb: [th_cmc_joint, th_mcp_joint, th_ip_joint]
  index: [ff_mcp_joint, ff_dip_joint]
  middle: [mf_mcp_joint, mf_dip_joint]
  ring: [rf_mcp_joint, rf_dip_joint]
  little: [lf_mcp_joint, lf_dip_joint]
# TODO(指导老师): 确认四个 distal 关节对应真实机构的 PIP/DIP 机械关系。
# 当前 0.65/0.35 仅为可配置的软件初始标定值，不代表真实硬件传动参数。
human_mapping:
  th_cmc_joint: {sources: {thumb_mcp: 1.0}}
  th_mcp_joint: {sources: {thumb_pip: 1.0}}
  th_ip_joint: {sources: {thumb_dip: 1.0}}
  ff_mcp_joint: {sources: {index_mcp: 1.0}}
  ff_dip_joint: {sources: {index_pip: 0.65, index_dip: 0.35}}
  mf_mcp_joint: {sources: {middle_mcp: 1.0}}
  mf_dip_joint: {sources: {middle_pip: 0.65, middle_dip: 0.35}}
  rf_mcp_joint: {sources: {ring_mcp: 1.0}}
  rf_dip_joint: {sources: {ring_pip: 0.65, ring_dip: 0.35}}
  lf_mcp_joint: {sources: {little_mcp: 1.0}}
  lf_dip_joint: {sources: {little_pip: 0.65, little_dip: 0.35}}
# tip_local_m 来自 STL 经 MuJoCo mesh ref pose 变换后的指端顶点簇中心。
kinematic_chains:
  thumb:
    base_pos_m: [-0.020000, 0.038192, 0.011000]
    joints:
      - {name: th_cmc_joint, axis: [0, 1, 0], child_offset_m: [-0.021716, -0.010654, 0]}
      - {name: th_mcp_joint, axis: [0, 0, -1], child_offset_m: [-0.036720, 0.025744, -0.00071118]}
      - {name: th_ip_joint, axis: [0, 0, -1], child_offset_m: [0, 0, 0]}
    tip_local_m: [-0.037691, 0.025565, 0.000682]
  index:
    base_pos_m: [-0.032828, 0.092985, 0.001710]
    base_quat_wxyz: [0.999848, 0, 0, 0.0174526]
    joints:
      - {name: ff_mcp_joint, axis: [1, 0, 0], child_offset_m: [0.009250, 0.0293939, -0.006000]}
      - {name: ff_dip_joint, axis: [1, 0, 0], child_offset_m: [0, 0, 0]}
    tip_local_m: [-0.003247, 0.039409, 0.009286]
  middle:
    base_pos_m: [-0.015000, 0.093700, 0.001710]
    joints:
      - {name: mf_mcp_joint, axis: [1, 0, 0], child_offset_m: [0.009350, 0.0344819, -0.006000]}
      - {name: mf_dip_joint, axis: [1, 0, 0], child_offset_m: [0, 0, 0]}
    tip_local_m: [-0.003247, 0.039409, 0.009286]
  ring:
    base_pos_m: [0.0033422, 0.093403, 0.001710]
    base_quat_wxyz: [0.999848, 0, 0, -0.0174526]
    joints:
      - {name: rf_mcp_joint, axis: [1, 0, 0], child_offset_m: [0.009250, 0.0293939, -0.006000]}
      - {name: rf_dip_joint, axis: [1, 0, 0], child_offset_m: [0, 0, 0]}
    tip_local_m: [-0.003247, 0.039409, 0.009286]
  little:
    base_pos_m: [0.021077, 0.091595, 0.001710]
    base_quat_wxyz: [0.999391, 0, 0, -0.0348994]
    joints:
      - {name: lf_mcp_joint, axis: [1, 0, 0], child_offset_m: [0.009250, 0.0293939, -0.006000]}
      - {name: lf_dip_joint, axis: [1, 0, 0], child_offset_m: [0, 0, 0]}
    tip_local_m: [-0.003217, 0.034416, 0.009229]
simulation_names:
  palm_body: palm_link
  palm_geom: ch_m6_palm_collision
  finger_body_prefixes: {thumb: th_, index: ff_, middle: mf_, ring: rf_, little: lf_}
  fingertip_bodies: {thumb: th_distal_link, index: ff_distal_link, middle: mf_distal_link, ring: rf_distal_link, little: lf_distal_link}
  fingertip_sites: {thumb: thumb_tip, index: index_tip, middle: middle_tip, ring: ring_tip, little: little_tip}
  fingertip_geoms: {thumb: thumb_pad, index: index_pad, middle: middle_pad, ring: ring_pad, little: little_pad}
  # TODO(指导老师): 指腹球为接触代理；需按真实指腹/触觉区域校准位置和半径。
  fingertip_radius_m: {thumb: 0.0070, index: 0.0060, middle: 0.0060, ring: 0.0060, little: 0.0055}
# TODO(指导老师): 若真实 CH-M6 存在电机/腱耦合，在此增加实测 synergy 约束。
synergies: {}