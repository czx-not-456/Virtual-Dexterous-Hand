mujoco:
  model_path: CH-M6/CH-M6_L.xml
  robot_model: CH-M6_L
  task_object_body: grasp_object
  default_camera: overview
  default_task: wrap
  physics_timestep_s: 0.002
  palm_pos_m: [0.0, 0.0, 0.240]
  palm_quat_wxyz: [0.0, 0.0, 1.0, 0.0]
  table:
    pos: [0.0, 0.10, 0.035]
    size: [0.24, 0.20, 0.035]
  auto_reset_object: true
  hold_task_object_when_inactive: true
  object_workspace_radius_m: 0.30
  object_min_z_m: 0.040
  stability_orientation_deg: 5.0
  evaluation:
    min_success_streak_frames: 12
  camera_presets:
    overview: {lookat: [0.0, 0.09, 0.16], distance: 0.48, azimuth: 135.0, elevation: -22.0}
    closeup: {lookat: [0.02, 0.10, 0.18], distance: 0.30, azimuth: 135.0, elevation: -18.0}
    side: {lookat: [0.0, 0.10, 0.17], distance: 0.40, azimuth: 90.0, elevation: -10.0}
  # TODO(指导老师): 任务物体尺寸/位姿、摩擦和密度需按最终实验夹具复测。
  task_objects:
    neutral:
      label: neutral_reference
      interaction: neutral
      active_intent: NEUTRAL
      required_success_metric: none
      type: sphere
      size: [0.025]
      pos: [0.15, 0.10, 0.095]
      mass_density: 250
    pinch:
      label: precision_block
      interaction: pinch
      active_intent: PINCH
      required_success_metric: contact
      type: box
      size: [0.008, 0.025, 0.060]
      pos: [0.042, 0.110, 0.130]
      mass_density: 360
      contact_faces:
        thumb: {axis: 0, sign: 1}
        index: {axis: 0, sign: -1}
    wrap:
      label: wrap_cylinder
      interaction: wrap
      active_intent: WRAP
      required_success_metric: stable
      type: cylinder
      size: [0.035, 0.065]
      pos: [0.000, 0.100, 0.135]
      mass_density: 320